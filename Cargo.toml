[package]
name = "nml"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
lazy_static = "1.5.0"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
insta = "1.47.2"
rstest = "0.26"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
